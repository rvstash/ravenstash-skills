name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate skill packages and eval catalog
        run: python3 scripts/validate.py
      - name: Check whitespace
        run: git diff --check

  commands:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Set up the verified CLI release
        uses: rvstash/setup-ravenstash@002b67ca6eedba2e4e2bb79993075b14e53cf7fb # v0.1.1
        with:
          version: "0.17.0"
      - name: Check rvs commands and options in skill examples
        run: python3 scripts/check_rvs_commands.py
